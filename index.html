<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kempo Techniques</title>
    <style>
        .center-text {
            display: flex;
            justify-content: center;
        }

        @font-face {
            font-family: 'Karate';
            src: url(Karate.ttf);
        }

        #techName {
            font-size: 100px;
            font-family: Arial, Helvetica, sans-serif;
        }
        #countdown {
            font-size:50px;
            font-family: Arial, Helvetica, sans-serif;
            color:cadetblue;
        }

    </style>
</head>
<body>
    <h1>Kempo Techniques</h1>
    <input id="speedSlider" type="range" name="speed" min="2" max="10" value="4">
    <label id="speedSliderLabel" for="speed">Speed: 4</label>
    <br>
    <input type="checkbox" name="mir" id="mirb">
    <label for="mir">Mirror Image</label>
    <br>
    <input id="mir-slider" type="range" name="mir-slider" min="0" max="100" value="50" step="25">
    <label for="mir-slider" id="mir-slider-label">Mirror%: 50%</label>
    <br>
    <button id="soloButton">Say a Technique</button>
    <br>
    <button id="start">Start</button>
    <br>
    <button id="stop">Stop</button>
    <br>
    <!--
        <button id="all">All Techniques</button>
        <br>
        <button id="stop-all">Stop All Techniques</button>
        <br>
        -->
    <input name="times" type="range" id="times" min="1" max="10" step="1" value="1">
    <label for="times" id="times-label">Times: 1</label>
    <br>
    <input type="checkbox" name="splitbox" id="splitbox">
    <label for="splitbox">Half Mirror?</label>
    <br>
    <button id="allt">All Techniques</button>
    <br>
    <button id="stop-allt">Stop All Techniques</button>
    <br>
    <p id="countdown" class="center-text">0</p>
    <p id="techName" class="center-text">Technique</p>
    <script src="script.js"></script>
</body>
</html>
